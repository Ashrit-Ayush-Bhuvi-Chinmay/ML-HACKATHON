<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PathSnap Route Evaluator</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #172033; background: #f3f6fb; }
    body { max-width: 900px; margin: 3rem auto; padding: 0 1rem; }
    main { background: white; padding: 2rem; border-radius: 16px; box-shadow: 0 8px 30px #1d355710; }
    h1 { margin-top: 0; } textarea { width: 100%; min-height: 220px; font: 14px ui-monospace, monospace; }
    button { margin-top: 1rem; padding: .7rem 1rem; background: #1d4ed8; color: white; border: 0; border-radius: 8px; cursor: pointer; }
    pre { white-space: pre-wrap; background: #f3f6fb; padding: 1rem; border-radius: 8px; }
    .note { color: #526078; }
  </style>
</head>
<body><main>
  <h1>PathSnap Route Evaluator</h1>
  <p class="note">Paste GPS observations as JSON. This page sends observations only; evaluator labels are never submitted to the prediction endpoint.</p>
  <textarea id="payload">{
  "points": [
    {"trajectory_id":"demo","point_index":0,"latitude":0,"longitude":0},
    {"trajectory_id":"demo","point_index":1,"latitude":0,"longitude":0}
  ]
}</textarea>
  <button id="run">Match route</button>
  <pre id="result">Waiting for a configured model artifact.</pre>
</main>
<script>
document.querySelector('#run').addEventListener('click', async () => {
  const output = document.querySelector('#result');
  try {
    const response = await fetch('/api/match', {method:'POST', headers:{'Content-Type':'application/json'}, body:document.querySelector('#payload').value});
    const body = await response.json(); output.textContent = JSON.stringify(body, null, 2);
  } catch (error) { output.textContent = String(error); }
});
</script></body></html>
