[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathsnap"
version = "0.1.0"
description = "Reproducible GPS map matching with ML and HMM route decoding"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "scikit-learn>=1.3",
  "geopandas>=0.14", "shapely>=2.0", "pyproj>=3.6", "matplotlib>=3.8", "seaborn>=0.13",
  "folium>=0.15", "fastapi>=0.110", "uvicorn>=0.27",
  "optuna>=3.5", "joblib>=1.3"
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
notebook = ["jupyterlab>=4", "ipykernel>=6"]
gpu = ["xgboost>=3.0", "torch>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
